name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Unit- und Integrationstests
        run: dotnet test backend/Notes.sln --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Anwendung starten
        run: docker compose up --build -d --wait
      - name: Playwright installieren
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E-Tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint deploy/helm/notes
      - name: Manifeste rendern
        run: helm template notes deploy/helm/notes > /dev/null

  kubernetes:
    needs: [backend, frontend, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: notes

      - name: Images bauen
        run: |
          docker build -t notes-api:dev backend
          docker build -t notes-web:dev frontend

      - name: Images in den Cluster laden
        run: kind load docker-image notes-api:dev notes-web:dev --name notes

      - name: Chart installieren
        run: helm install notes deploy/helm/notes --wait --timeout 5m

      - name: Port weiterleiten
        run: |
          kubectl port-forward svc/web 8081:80 &
          sleep 3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Playwright installieren
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E-Tests gegen Kubernetes
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8081
        run: npx playwright test

      - name: Diagnose bei Fehler
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs deploy/api --tail=100 || true

