apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - until pg_isready -h db -p 5432 -U {{ .Values.postgres.user }}; do sleep 2; done
      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: ConnectionStrings__Notes
              value: "Host=db;Database={{ .Values.postgres.database }};Username={{ .Values.postgres.user }};Password=$(DB_PASSWORD)"
            - name: ConnectionStrings__RabbitMq
              value: "amqp://guest:guest@mq:5672/"
            - name: MigrateOnStartup
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/notes
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
